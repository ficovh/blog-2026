baseURL = "https://blog.bsdguy.org/"
languageCode = "en-us"
title = "netlog"
theme = "hugo-clarity"
copyright = "Francisco Valladolid"
enableEmoji = true
enableRobotsTXT = true
enableInlineShortcodes = true
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "Network engineer. Writing about routing, automation, and the internet's plumbing."
  introDescription = "Network engineer. Writing about routing, automation, and the internet's plumbing."
  introURL = "about/"
  mainSections = ["posts"]
  blogDir = "posts"
  enableSearch = true
  enforceDarkMode = true
  mobileNavigation = "left"
  codeMaxLines = 20
  codeLineNumbers = false
  figurePositionShow = false
  usePageBundles = false
  showShare = false
  comments = false
  since = 2024
  numberOfTagsShown = 14
  fallBackOgImage = "profile.jpg"

  [params.author]
    name = "Francisco Valladolid"
    photo = "profile.jpg"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNoStart = 1
    # Clarity requiere lineNos=true + lineNumbersInTable=false para su toggle de números de línea
    lineNos = true
    lineNumbersInTable = false
    noClasses = false
    tabWidth = 2

[taxonomies]
  tag = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "gallery"
    name = "Gallery"
    url = "/gallery/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30

  [[menu.social]]
    name = "github"
    url = "https://github.com/ficovh"
    weight = 1
  [[menu.social]]
    name = "rss"
    url = "index.xml"
    weight = 2
